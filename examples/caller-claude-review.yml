name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  review:
    # Required if the org's default GITHUB_TOKEN permission is "restricted".
    # The reusable workflow needs these to post inline PR comments and use OAuth.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: fidelta-v/ci-workflows/.github/workflows/claude-review.yml@v1
    with:
      project_description: "REPLACE-ME (one-line context about this repo)"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Optional: post a summary to Google Chat after the review
      # GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
